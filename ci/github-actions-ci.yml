name: CI
on:
  push: { branches: ['**'] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      # Order per docs/TESTING_CONTRACT.md §4
      - name: Typecheck
        run: npm run typecheck
      - name: Decimal / RTL guard (ADR-0004, CODING_RULES)
        run: npm run guard:decimal
      - name: Tests — domain, schema rebuild-from-zero, RLS isolation, immutability
        run: npm test
